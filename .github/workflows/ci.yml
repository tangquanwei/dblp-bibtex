name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate extension
        run: npm run check

      - name: Package extension
        run: npm run pack

      - uses: actions/upload-artifact@v4
        with:
          name: dblp-bibtex
          path: dist/*.zip
          if-no-files-found: error
